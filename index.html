<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CapZone - Top Off Your Style</title>
    <meta name="description" content="CapZone - Top Off Your Style. Premium streetwear and headwear e-commerce store dedicated exclusively to selling caps and hats around Roxas, Oriental Mindoro (PHP ₱). Local express delivery across all 20 Roxas barangays." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0B0F17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CapZone" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="CapZone - Headwear & Streetwear" />
    <meta property="og:description" content="CapZone - Top Off Your Style. Premium streetwear and headwear e-commerce store dedicated exclusively to selling caps and hats around Roxas, Oriental Mindoro (PHP ₱)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0F17] text-white antialiased selection:bg-blue-600 selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
